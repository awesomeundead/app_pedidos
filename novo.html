<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Novo pedido</title>
<link href="layout.css" rel="stylesheet" />
<link href="default.css" rel="stylesheet" />
<link rel="apple-touch-icon" sizes="180x180" href="public/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="public/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="public/favicon-16x16.png">
<link rel="manifest" href="public/site.webmanifest">
<script src="default.js"></script>
<script src="auth.js"></script>
</head>
<body>

<div id="app">
    <header>
        <nav>
            <a href="pedidos.html">Pedidos</a>
            <a href="produtos.html">Produtos</a>
            <a href="relatorio.html">Relatório de vendas</a>
        </nav>
        <div class="identificacao">
            <input id="nome" name="nome" placeholder="Nome" type="text" />
            <input id="telefone" maxlength="15" name="telefone" placeholder="Telefone" type="tel" />
            <input id="endereco" list="logradouros" name="endereco" placeholder="Endereço" type="text" />
        </div>
    </header>
    <main>
        <div class="flex_columns space_between">
            <div>Selecione os itens</div>
            <div>Quantidade</div>
        </div>
        <template>
            <div class="item">
                <div class="imagem">
                    <img alt="" src="" />
                </div>
                <div>
                    <div class="nome"></div>
                    <div class="preco"></div>
                    <div class="preco_desconto"></div>
                </div>
                <div>
                    <input name="itens_preco" type="hidden" />
                    <input name="itens_preco_desconto" type="hidden" />
                    <input class="short" min="0" name="itens_quantidade" type="number" />
                </div>
            </div>
        </template>
        <div id="produtos"></div>
    </main>
    <footer>
        <div class="flex_rows">
            <div class="flex_columns space_between">
                <div class="flex_rows">
                    <label for="subtotal">Subtotal (R$)</label>
                    <input class="short" id="subtotal" name="subtotal" readonly="readonly" type="number" />
                </div>
                <div class="flex_rows">
                    <label for="desconto" >Desconto (R$)</label>
                    <input class="short" id="desconto" min="0" name="desconto" step=".01" type="number" />
                </div>
                <div class="flex_rows">
                    <label for="frete">Frete (R$)</label>
                    <input class="short" id="frete" min="0" name="frete" step=".01" type="number" />
                </div>
                <div class="flex_rows">
                    <label for="total">Total (R$)</label>
                    <input class="short" id="total" name="total" readonly="readonly" type="number" />
                </div>
            </div>
            <select id="pagamento" name="pagamento" required="required">
                <option disabled="disabled" selected="selected" value="">Pagamento</option>
                <option>Dinheiro</option>
                <option>Pix</option>
                <option>Débito</option>
                <option>Crédito</option>
            </select>
            <button type="submit">Criar pedido</button>
        </div>
    </footer>
</div>

<script>

function adicionar_carrinho(item)
{
    const item_id = item.dataset.id;
    const index = item_id - 1;

    let item_preco = parseFloat(document.querySelector(`[name="itens_preco"][data-id="${item_id}"]`).value);
    let item_preco_desconto = document.querySelector(`[name="itens_preco_desconto"][data-id="${item_id}"]`).value;

    item_preco_desconto = item_preco_desconto.length ? parseFloat(item_preco_desconto) : 0;

    carrinho[index] =
    {
        "id": item_id,
        'preco': item_preco,
        'preco_desconto': item_preco_desconto,
        'quantidade': item.value
    };

    calcular();
}

function calcular()
{
    let subtotal = 0;

    carrinho.forEach(item =>
    {
        const preco = (item.preco_desconto > 0) ? item.preco_desconto : item.preco;
        subtotal += preco * item.quantidade;
    });

    let desconto = document.getElementById('desconto').value;
    let frete = document.getElementById('frete').value;

    if (desconto.trim() === '')
    {
        desconto = 0;
    }

    if (frete.trim() === '')
    {
        frete = 0;
    }

    desconto = parseFloat(desconto);
    frete = parseFloat(frete);
    let total = (subtotal - desconto) + frete;

    document.getElementById('subtotal').value = subtotal.toFixed(2);
    document.getElementById('total').value = total.toFixed(2);
}

function buscarProdutos()
{
    fetch('api/v1/produtos?disponibilidade=1', 
    {
        headers:
        {
            'Authorization': `ApiKey ${apikey}`
        }
    })
    .then(response => 
    {
        if (!response.ok)
        {
            throw new Error(response.statusText);
        }

        return response.json();
    })
    .then(json =>
    {
        renderizarProdutos(json.produtos);

        document.querySelectorAll('input[name="itens_quantidade"]').forEach(item =>
        {        
            item.addEventListener('input', () =>
            {
                adicionar_carrinho(item);
            });
        });
    })
    .catch(error =>
    {
        console.error('Erro ao carregar:', error);
    });
}

function enviarPedido(url, body)
{
    fetch(url,
    {
        body: JSON.stringify(body),
        headers:
        {
            'Authorization': `ApiKey ${apikey}`,
            'Content-Type': 'application/json'
        },
        method: 'post'
    })
    .then(response =>
    {
        if (!response.ok)
        {
            throw new Error(response.statusText);
        }

        return response.json();
    })
    .then(json =>
    {
        if (json.hasOwnProperty('status'))
        {
            notification(json.status, {success: 'Pedido criado com sucesso.', failure: 'Falha ao criar pedido.'});

            if (json.status == 'success')
            {
                carrinho = [];

                document.querySelectorAll('input, select').forEach(item =>
                {
                    item.value = '';
                });

                buscarProdutos();
            }
        }
        else
        {
            console.log(json);
        }

        submit.disabled = false;
    })
    .catch(error =>
    {
        console.error('Erro ao carregar:', error);
    });
}

function renderizarProdutos(produtos)
{
    const container = document.getElementById('produtos');
    const template = document.querySelector('template');

    container.innerHTML = '';

    produtos.forEach((item, index) =>
    {
        const clone = template.content.cloneNode(true);
        const imagem = (item.imagem) ? `${item.imagem}.webp` : 'noimage.png';
        const currency = new Intl.NumberFormat('pt-BR', {style: 'currency', currency: 'BRL'});

        clone.querySelector('.imagem img').src = `imagens/${imagem}`;
        clone.querySelector('.nome').textContent = item.nome;
        clone.querySelector('.preco').textContent = currency.format(item.preco);
        
        if (item.preco_desconto)
        {
            clone.querySelector('.preco_desconto').textContent = currency.format(item.preco_desconto);
            clone.querySelector('.preco').classList.add('riscado');
        }
        else
        {
            clone.querySelector('.preco_desconto').remove();
        }

        const preco = clone.querySelector('[name="itens_preco"]');
        preco.value = item.preco;
        preco.dataset.id = item.id;

        const preco_desconto = clone.querySelector('[name="itens_preco_desconto"]')
        preco_desconto.value = item.preco_desconto;
        preco_desconto.dataset.id = item.id;

        clone.querySelector('[name="itens_quantidade"]').dataset.id = item.id;

        container.appendChild(clone);
    });
}

var carrinho = [];

buscarProdutos();
logradouros();

document.getElementById('desconto').addEventListener('keyup', () =>
{
    calcular();
});

document.getElementById('frete').addEventListener('keyup', () =>
{
    calcular();
});

const submit = document.querySelector('button[type="submit"]');

submit.addEventListener('click', e =>
{
    submit.disabled = true;

    if (confirm('Você confirma esta ação?'))
    {
        const body =
        {
            'nome': document.getElementById('nome').value,
            'telefone': document.getElementById('telefone').value,
            'endereco': document.getElementById('endereco').value,
            'subtotal': document.getElementById('subtotal').value,
            'desconto': document.getElementById('desconto').value,
            'frete': document.getElementById('frete').value,
            'total': document.getElementById('total').value,
            'pagamento': document.getElementById('pagamento').value,
            'itens': Object.values(carrinho)
        };
        
        let validation;

        document.querySelectorAll('input, select').forEach(item =>
        {
            if (!item.checkValidity())
            {
                alert(item.validationMessage);
                
                validation = item.validationMessage;
            }
        });

        if (validation)
        {
            submit.disabled = false;
            return;
        }

        enviarPedido('api/v1/pedido', body);
    }
});

</script>
    
</body>
</html>
